<extend template="base.shtml">
<head id="head">
	<style>
		.home-hero {
			position: relative;
			overflow: hidden;
			border: 1px solid #60411f;
			border-left: 5px solid var(--orange);
			border-radius: 5px;
			padding: clamp(22px, 5vw, 38px);
			background:
				radial-gradient(ellipse at 92% 0%, rgb(255 101 0 / 18%), transparent 42%),
				linear-gradient(145deg, #1a2b43, #101f35 68%);
			box-shadow: inset 0 1px rgb(255 255 255 / 4%);
		}

		.home-kicker,
		.game-label {
			margin: 0;
			color: var(--orange-glow);
			font-size: 0.76rem;
			font-weight: 850;
			letter-spacing: 0.14em;
			text-transform: uppercase;
		}

		.home-hero h1 {
			margin: 0.25em 0 0;
			font-size: clamp(2.1rem, 7vw, 3.35rem);
			line-height: 1;
		}

		.game-title {
			margin-top: 0.8em;
			color: #fff1da;
			font-family: "Bangers", Impact, sans-serif;
			font-size: clamp(1.4rem, 4vw, 2rem);
			letter-spacing: 0.06em;
		}

		.home-intro {
			max-width: 58ch;
			color: #d9e1eb;
			font-size: 1.05rem;
		}

		.home-intro p:last-child {
			margin-bottom: 0;
		}

		.home-actions {
			display: flex;
			flex-wrap: wrap;
			gap: 10px;
			margin-top: 22px;
		}

		.home-button {
			display: inline-block;
			border: 1px solid #d8943c;
			border-radius: 4px;
			padding: 9px 14px;
			background: #ff7600;
			color: #211409;
			font-weight: 850;
		}

		.home-button:hover,
		.home-button:focus-visible {
			background: #ffb52e;
			color: #211409;
			text-decoration: none;
		}

		.home-button-secondary {
			border-color: var(--line);
			background: #0b192b;
			color: #fff1da;
		}

		.latest-section {
			margin-top: 34px;
		}

		.latest-heading {
			display: flex;
			align-items: baseline;
			justify-content: space-between;
			gap: 12px;
		}

		.latest-heading h2 {
			margin-top: 0;
		}

		.entry-list {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 12px;
		}

		.entry-card {
			border: 1px solid var(--line);
			border-radius: 4px;
			padding: 15px 16px;
			background: linear-gradient(145deg, rgb(28 48 76 / 72%), #101f35 76%);
		}

		.entry-date {
			color: var(--muted);
			font-size: 0.82rem;
			font-weight: 750;
			letter-spacing: 0.04em;
		}

		.entry-card h3 {
			margin: 0.42em 0;
		}

		.entry-card h3 a {
			color: var(--orange-glow);
		}

		.entry-card p {
			margin-bottom: 0.5em;
		}

		.archive-link {
			font-size: 0.9rem;
			font-weight: 750;
		}

		.archive-actions {
			margin-top: 14px;
		}

		@media (max-width: 640px) {
			.entry-list {
				grid-template-columns: minmax(0, 1fr);
			}

			.latest-heading {
				align-items: flex-start;
				flex-direction: column;
			}
		}
	</style>
</head>
<section id="content">
	<div class="home-hero">
		<p class="home-kicker">WHAM! BAM! STUDIOS PRESENTS</p>
		<h1 :text="$page.title"></h1>
		<p class="game-title">WHAM! BAM! HAM-HAM! — CARD BRAWLER</p>
		<div class="home-intro" :html="$page.content()"></div>
		<div class="home-actions">
			<a class="home-button" href="$site.page('guides').link()">Meet the game · Player Guide</a>
			<a class="home-button home-button-secondary" href="$site.page('devlog').link()">Browse all entries</a>
		</div>
	</div>
	<section class="latest-section" aria-labelledby="latest-heading">
		<div class="latest-heading">
			<h2 id="latest-heading">Latest entries</h2>
			<a class="archive-link" href="$site.page('devlog').link()">Full archive →</a>
		</div>
		<div class="entry-list" :loop="$site.page('devlog').subpagesByTag('devlog')">
			<article class="entry-card" :if="$loop.idx.gt(4).not()">
				<time class="entry-date" :text="$loop.it.date.format('October 02, 2006')"></time>
				<h3><a href="$loop.it.link()" :text="$loop.it.title"></a></h3>
				<p :text="$loop.it.description"></p>
				<a class="archive-link" href="$loop.it.link()">Read entry →</a>
			</article>
		</div>
		<p class="archive-actions"><a href="$site.page('devlog').alternative('rss').link()">Subscribe via RSS</a></p>
	</section>
</section>
