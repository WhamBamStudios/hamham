<extend template="base.shtml">
<head id="head">
	<style>
		.archive-intro {
			max-width: 66ch;
		}

		.archive-list,
		.year-list {
			display: grid;
			gap: 12px;
		}

		.archive-entry,
		.year-entry {
			border: 1px solid var(--line);
			border-radius: 4px;
			padding: 15px 18px;
			background: linear-gradient(145deg, rgb(28 48 76 / 68%), #101f35 78%);
		}

		.archive-entry h3,
		.year-entry h3 {
			margin: 0.3em 0;
		}

		.archive-entry h3 a {
			color: var(--orange-glow);
		}

		.archive-entry p:last-child {
			margin-bottom: 0;
		}

		.entry-date {
			color: var(--muted);
			font-size: 0.82rem;
			font-weight: 750;
			letter-spacing: 0.04em;
		}
	</style>
</head>
<section id="content">
	<h1 :text="$page.title"></h1>
	<div class="archive-intro" :html="$page.content()"></div>
	<section aria-labelledby="entries-heading">
		<h2 id="entries-heading">All entries</h2>
		<div class="archive-list" :loop="$page.subpagesByTag('devlog')">
			<article class="archive-entry">
				<time class="entry-date" :text="$loop.it.date.format('October 02, 2006')"></time>
				<h3><a href="$loop.it.link()" :text="$loop.it.title"></a></h3>
				<p :text="$loop.it.description"></p>
			</article>
		</div>
	</section>
	<section aria-labelledby="years-heading">
		<h2 id="years-heading">Year overviews</h2>
		<div class="year-list" :loop="$page.subpages()">
			<article class="year-entry" :if="$loop.it.layout.eql('devlog.shtml')">
				<time class="entry-date" :text="$loop.it.date.format('2006')"></time>
				<h3><a href="$loop.it.link()" :text="$loop.it.title"></a></h3>
			</article>
		</div>
	</section>
</section>
